plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseStorePath = System.getenv("AI_KHATA_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("AI_KHATA_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("AI_KHATA_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("AI_KHATA_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias &&
        releaseKeyPassword && file(releaseStorePath).exists()
android {
    namespace "com.aikhata.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.aikhata.app"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "2.6.0"
        buildConfigField "String", "AI_BACKEND_URL", '"https://ai-khata.onrender.com"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    testOptions { unitTests { includeAndroidResources = true } }
    packaging { resources { excludes += ["/META-INF/AL2.0", "/META-INF/LGPL2.1"] } }
}
dependencies {
    implementation platform("androidx.compose:compose-bom:2025.01.00")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.vanniktech:android-image-cropper:4.7.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
