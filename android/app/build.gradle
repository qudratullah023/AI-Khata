plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
android {
    namespace "com.aikhata.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.aikhata.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "2.2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    packaging { resources { excludes += ["/META-INF/AL2.0", "/META-INF/LGPL2.1"] } }
}
dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
}
