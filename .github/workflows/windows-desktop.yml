name: AI Khata Windows desktop build

on:
  push:
    branches: ["windows-desktop-parity"]
  pull_request:
    branches: ["main", "next-gen-assistant-ux-cloud"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller
      - name: Compile-check application
        run: python -m py_compile desktop/windows/main.py
      - name: Build standalone Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AI-Khata desktop/windows/main.py
      - name: Install Inno Setup
        uses: jrsoftware/setup-innosetup@v1
      - name: Build installable Windows setup EXE
        run: iscc desktop/windows/installer.iss
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "desktop/windows/dist/AI-Khata-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer EXE was not created" }
          if ((Get-Item $installer).Length -lt 1000000) { throw "Installer EXE is unexpectedly small" }
          Get-FileHash $installer -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-khata-windows-installer
          path: desktop/windows/dist/AI-Khata-Setup.exe
          if-no-files-found: error
          retention-days: 14
