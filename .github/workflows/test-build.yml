name: AI Khata checks and Android APK

on:
  push:
    branches: ["main", "complete-app-android"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-khata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  android-debug:
    name: Test Android logic and build debug and release APKs
    runs-on: ubuntu-latest
    env:
      AI_KHATA_RELEASE_KEYSTORE_BASE64: ${{ secrets.AI_KHATA_RELEASE_KEYSTORE_BASE64 }}
      AI_KHATA_RELEASE_STORE_PASSWORD: ${{ secrets.AI_KHATA_RELEASE_STORE_PASSWORD }}
      AI_KHATA_RELEASE_KEY_ALIAS: ${{ secrets.AI_KHATA_RELEASE_KEY_ALIAS }}
      AI_KHATA_RELEASE_KEY_PASSWORD: ${{ secrets.AI_KHATA_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Configure optional release signing key
        if: ${{ env.AI_KHATA_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          printf '%s' "$AI_KHATA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ai-khata-release.jks"
          echo "AI_KHATA_RELEASE_STORE_FILE=$RUNNER_TEMP/ai-khata-release.jks" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle -p android testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-khata-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
